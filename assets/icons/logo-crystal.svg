<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- obsidian crystal: near-black facets with a faint violet glint, one bone highlight.
       reads as pure black from arm's length, that's the point -->
  <polygon points="18,10 46,10 32,28" fill="#0d0918"/>
  <polygon points="46,10 56,26 32,28" fill="#0b0713"/>
  <polygon points="56,26 44,40 32,28" fill="#08060f"/>
  <polygon points="44,40 32,56 32,28" fill="#0c0815"/>
  <polygon points="32,56 20,40 32,28" fill="#07050e"/>
  <polygon points="20,40 8,26 32,28" fill="#0b0714"/>
  <polygon points="8,26 18,10 32,28" fill="#120b20"/>
  <!-- the single faint violet glint, only hue besides gold anywhere -->
  <polygon points="18,10 46,10 56,26 8,26" fill="#171026" opacity=".38"/>
  <g fill="none" stroke="#b8976a" stroke-width=".8" stroke-linejoin="round" opacity=".55">
    <polygon points="18,10 46,10 56,26 44,40 32,56 20,40 8,26"/>
    <line x1="18" y1="10" x2="32" y2="28"/>
    <line x1="46" y1="10" x2="32" y2="28"/>
    <line x1="56" y1="26" x2="32" y2="28"/>
    <line x1="44" y1="40" x2="32" y2="28"/>
    <line x1="32" y1="56" x2="32" y2="28"/>
    <line x1="20" y1="40" x2="32" y2="28"/>
    <line x1="8" y1="26" x2="32" y2="28"/>
  </g>
  <!-- bone specular hit, upper left facet -->
  <polygon points="24,15 27,17 24,19 21,17" fill="#ede8e0" opacity=".9"/>
</svg>
