  <polyline points="32,30 32,44" fill="none" stroke="#b8976a" stroke-width="1" opacity=".45"/>
  <polyline points="32,44 46,57" fill="none" stroke="#b8976a" stroke-width="1" opacity=".35"/>
  <polyline points="32,44 18,57" fill="none" stroke="#b8976a" stroke-width="1" opacity=".35"/>
  <circle cx="21" cy="18" r="2.6" fill="#ede8e0"/>
