<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showcase — Obsidian Motors</title>
  <meta name="description" content="Walk around the collection in 3D. Orbit, zoom, and study every line — live in your browser." />
  <meta name="theme-color" content="#07080a" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="site.webmanifest" />
  <meta property="og:title" content="Showcase — Obsidian Motors" />
  <meta property="og:description" content="Walk around the collection in 3D — orbit, zoom, and study every line." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <script>document.documentElement.classList.add("js");</script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="showcase">
<div id="page-fade" aria-hidden="true"></div>
  <nav class="scroll-dots" aria-hidden="true"></nav>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <svg class="crystal" viewBox="0 0 32 32" aria-hidden="true">
          <polygon points="16,2 27,11 23,30 9,30 5,11" fill="none" stroke="#b8976a" stroke-width="1.4"/>
          <circle cx="10.5" cy="8.5" r="1.5" fill="#ede8e0"/>
        </svg>
        Obsidian <span>Motors</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="collection.html">Collection</a></li>
          <li><a href="showcase.html" class="is-current">Showcase</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="consign.html">Consign</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="contact.html" class="nav-cta">Enquire</a>
        <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span></button>
      </div>
    </div>
  </header>

  <main class="stage">
    <canvas id="showcase-canvas"></canvas>

    <!-- identity (top-left) -->
    <div class="sc-identity chip">
      <p class="sc-eyebrow">Showcase</p>
      <p class="sc-index">Blacklist <b data-sc-index>#15</b> / 03</p>
      <h1 class="sc-name" data-sc-name>BMW M3 GTR</h1>
      <p class="sc-tagline" data-sc-tag>The hero of Most Wanted.</p>
      <p class="sc-specline" data-sc-spec>2005 · Garching · 4.0L V8 · RWD</p>
    </div>

    <!-- interaction hint (top-right) -->
    <p class="sc-hint chip">Drag to orbit · scroll to zoom</p>

    <!-- car switch (right) -->
    <div class="sc-switch" role="group" aria-label="Choose a car">
      <button class="sc-switch-btn chip is-active" type="button" data-car="0"><span class="sc-switch-num">#15</span> BMW M3 GTR</button>
      <button class="sc-switch-btn chip" type="button" data-car="1"><span class="sc-switch-num">#14</span> Mercedes-AMG GT3</button>
      <button class="sc-switch-btn chip" type="button" data-car="2"><span class="sc-switch-num">#13</span> McLaren F1</button>
      <button class="sc-switch-btn chip" type="button" data-car="3"><span class="sc-switch-num">#12</span> Lamborghini Fenomeno</button>
    </div>

    <!-- dock (bottom-centre): turntable + camera views -->
    <div class="sc-dock chip">
      <button class="sc-start" type="button" aria-pressed="true"><small>Turntable</small><strong>Pause</strong></button>
      <div class="sc-views" role="group" aria-label="Camera angle">
        <button class="sc-view is-active" type="button">Exterior</button>
        <button class="sc-view" type="button">Profile</button>
        <button class="sc-view" type="button">Top</button>
      </div>
    </div>
  </main>

  <script src="js/site.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script type="module" src="js/showcase3d.js"></script>
</body>
</html>
